[build]
  command = "yarn build"
  publish = "dist"

[dev]
  command = "yarn dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so they can be cached indefinitely. This
# rule comes first because Netlify applies the first matching header rule.
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# The prerendered document is cached at the edge but revalidated quickly so a
# deploy is picked up without waiting for the browser cache to expire.
[[headers]]
  for = "/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
    netlify-cdn-cache-control = "public, max-age=3600, stale-while-revalidate=86400"

[[plugins]]
  package = "@netlify/plugin-local-install-core" # Ensures TS support in builds

# This is the magic part:
[hooks]
  pre-build = "npx ts-node scripts/seed-pinecone.ts"